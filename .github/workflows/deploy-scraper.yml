name: Deploy scraper to droplet

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'main.py'
      - 'requirements.txt'
      - 'parking-scraper.service'
      - 'parking-scraper.timer'
      - 'parking-scraper-report.service'
      - 'parking-scraper-report.timer'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_KEY }}
          script: |
            set -e
            cd /home/ubuntu/uncc-parking-scraper
            sudo -u ubuntu -H git fetch origin main
            sudo -u ubuntu -H git reset --hard origin/main
            sudo -u ubuntu -H venv/bin/pip install -r requirements.txt --quiet
            cp parking-scraper.service parking-scraper.timer parking-scraper-report.service parking-scraper-report.timer /etc/systemd/system/
            systemctl daemon-reload
            systemctl enable parking-scraper.timer parking-scraper-report.timer
            systemctl restart parking-scraper.timer parking-scraper-report.timer
